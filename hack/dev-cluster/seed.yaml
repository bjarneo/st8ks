apiVersion: v1
kind: Namespace
metadata: {name: prod}
---
apiVersion: v1
kind: Namespace
metadata: {name: staging}
---
apiVersion: v1
kind: Namespace
metadata: {name: data}
---
apiVersion: v1
kind: Namespace
metadata: {name: jobs}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: checkout-config, namespace: prod}
data: {CATALOG_CACHE_MAX: "250000", PORT: "8080"}
---
apiVersion: v1
kind: Secret
metadata: {name: db-credentials, namespace: prod}
stringData: {username: checkout, password: not-a-real-password}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: checkout, namespace: prod}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: prod, labels: {app: checkout, team: payments}}
spec:
  replicas: 2
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout, team: payments}}
    spec:
      serviceAccountName: checkout
      containers:
      - name: checkout
        image: busybox:1.36
        command: ["sh", "-c", "echo 'INFO starting checkout service'; echo 'INFO loading product catalog cache items=184220'; sleep 3; echo 'WARN heap in use 58Mi (limit 64Mi)'; tail /dev/zero"]
        envFrom: [{configMapRef: {name: checkout-config}}]
        ports: [{containerPort: 8080}]
        resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 200m, memory: 64Mi}}
        volumeMounts: [{name: config, mountPath: /app/config}, {name: creds, mountPath: /app/creds}]
      volumes:
      - {name: config, configMap: {name: checkout-config}}
      - {name: creds, secret: {secretName: db-credentials}}
---
apiVersion: v1
kind: Service
metadata: {name: checkout, namespace: prod}
spec: {selector: {app: checkout}, ports: [{port: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: prod, labels: {app: api-gateway, team: platform}}
spec:
  replicas: 2
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway, team: platform}}
    spec:
      containers:
      - name: gateway
        image: nginx:1.27-alpine
        ports: [{containerPort: 80, name: http}]
        resources: {requests: {cpu: 20m, memory: 32Mi}, limits: {cpu: 200m, memory: 128Mi}}
        readinessProbe: {httpGet: {path: /, port: 80}}
        livenessProbe: {httpGet: {path: /, port: 80}}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: prod}
spec: {selector: {app: api-gateway}, ports: [{port: 80}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: frontend, namespace: prod, labels: {app: frontend, team: web}}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend, team: web}}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: prod}
spec: {selector: {app: frontend}, ports: [{port: 80}]}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: {name: shop, namespace: prod}
spec:
  rules:
  - host: shop.acme.test
    http:
      paths:
      - {path: /, pathType: Prefix, backend: {service: {name: frontend, port: {number: 80}}}}
      - {path: /api, pathType: Prefix, backend: {service: {name: api-gateway, port: {number: 80}}}}
      - {path: /checkout, pathType: Prefix, backend: {service: {name: checkout, port: {number: 8080}}}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: api-gateway, namespace: prod}
spec: {minAvailable: 1, selector: {matchLabels: {app: api-gateway}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api-gateway, namespace: prod}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api-gateway}
  minReplicas: 2
  maxReplicas: 6
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: cleanup-sessions, namespace: prod}
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers: [{name: cleanup, image: busybox:1.36, command: ["sh", "-c", "echo cleaned 42 sessions"]}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: image-resizer, namespace: staging, labels: {app: image-resizer}}
spec:
  replicas: 1
  selector: {matchLabels: {app: image-resizer}}
  template:
    metadata: {labels: {app: image-resizer}}
    spec:
      containers: [{name: resizer, image: "busybox:1.9.0-rc1-does-not-exist"}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis, namespace: data}
spec:
  serviceName: redis-headless
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports: [{containerPort: 6379}]
        volumeMounts: [{name: data, mountPath: /data}]
  volumeClaimTemplates:
  - metadata: {name: data}
    spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: redis-headless, namespace: data}
spec: {clusterIP: None, selector: {app: redis}, ports: [{port: 6379}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: analytics, namespace: data, labels: {app: analytics}}
spec:
  replicas: 1
  selector: {matchLabels: {app: analytics}}
  template:
    metadata: {labels: {app: analytics}}
    spec:
      containers:
      - name: analytics
        image: busybox:1.36
        command: ["sleep", "infinity"]
        resources: {requests: {memory: 512Gi}}
---
apiVersion: batch/v1
kind: Job
metadata: {name: backfill-orders, namespace: jobs}
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers: [{name: backfill, image: busybox:1.36, command: ["sh", "-c", "echo 'ERROR cannot connect to orders db'; exit 3"]}]
---
apiVersion: batch/v1
kind: Job
metadata: {name: report, namespace: jobs}
spec:
  template:
    spec:
      restartPolicy: Never
      containers: [{name: report, image: busybox:1.36, command: ["sh", "-c", "echo report done"]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: checkout-config-reader, namespace: prod}
rules: [{apiGroups: [""], resources: [configmaps], verbs: [get, list, watch]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: checkout-config-reader, namespace: prod}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: checkout-config-reader}
subjects: [{kind: ServiceAccount, name: checkout, namespace: prod}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: payments-devs-edit, namespace: prod}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: edit}
subjects: [{kind: Group, name: payments-devs, apiGroup: rbac.authorization.k8s.io}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: payments-devs-view, namespace: data}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: Group, name: payments-devs, apiGroup: rbac.authorization.k8s.io}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: oncall-view}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: view}
subjects: [{kind: Group, name: oncall, apiGroup: rbac.authorization.k8s.io}, {kind: User, name: alice@acme.test, apiGroup: rbac.authorization.k8s.io}]
