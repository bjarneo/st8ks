name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK and WebKitGTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # frontend, typecheck, gofmt, go vet, staticcheck, govulncheck, race tests
      - run: make ci

      - name: Shellcheck
        run: shellcheck -x scripts/package.sh build/linux/install.sh hack/dev-cluster/*.sh

  build:
    name: Build (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            platform: linux/amd64
            tags: webkit2_41
          - name: macos
            os: macos-26
            platform: darwin/universal
            tags: ""
          - name: windows
            os: windows-2025
            platform: windows/amd64
            tags: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install GTK and WebKitGTK headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install the Wails CLI
        run: go install "github.com/wailsapp/wails/v2/cmd/wails@$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"

      - name: Build the frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build the app
        run: wails build -s -trimpath -platform "${{ matrix.platform }}" -tags "${{ matrix.tags }}"

      - name: Check the binary
        run: |
          case "$RUNNER_OS" in
            Linux) ./build/bin/st8ks --version ;;
            macOS) ./build/bin/st8ks.app/Contents/MacOS/st8ks --version ;;
            Windows) test -s build/bin/st8ks.exe && ls -l build/bin/st8ks.exe ;;
          esac
